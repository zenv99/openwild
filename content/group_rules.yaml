- {taxon: Russula, rank: genus, kingdom: Fungi, toxicity: serious, warning: "Brittlegills: many cause vomiting, and an East Asian species causes fatal muscle breakdown.", onset: "Usually within a few hours.", what_to_do: "Seek medical care for vomiting, muscle pain or dark urine.", source: "Wikipedia: Russula"}
- {taxon: Lactarius, rank: genus, kingdom: Fungi, toxicity: mild, warning: "Milkcaps: several species cause gastrointestinal upset.", onset: "Usually within a few hours.", what_to_do: "Seek medical care if symptoms are severe.", source: "Wikipedia: Lactarius"}
- {taxon: Scleroderma, rank: genus, kingdom: Fungi, toxicity: mild, warning: "Earthballs cause vomiting; mistaken for puffballs.", onset: "Within an hour or two.", what_to_do: "Seek medical care if symptoms are severe.", source: "Wikipedia: Scleroderma (fungus)"}
- {taxon: Agaricus, rank: genus, kingdom: Fungi, toxicity: mild, warning: "Some species (yellow stainers) cause vomiting; deadly white Amanitas look similar.", onset: "Usually within a few hours.", what_to_do: "Seek medical care if symptoms are severe.", source: "Wikipedia: Agaricus"}
- {taxon: Ramaria, rank: genus, kingdom: Fungi, toxicity: mild, warning: "Several coral fungi cause diarrhoea.", onset: "Usually within a few hours.", what_to_do: "Seek medical care if symptoms are severe.", source: "Wikipedia: Ramaria"}
- {taxon: Coprinopsis, rank: genus, kingdom: Fungi, toxicity: mild, warning: "Some ink caps react with alcohol, causing flushing, vomiting and racing heart.", onset: "Within minutes of drinking alcohol, up to days after eating.", what_to_do: "Avoid alcohol; seek care if symptoms are severe.", source: "Wikipedia: Coprinopsis atramentaria"}
- {taxon: Psilocybe, rank: genus, kingdom: Fungi, toxicity: mild, psychoactive: true, warning: "Psychoactive mushrooms. Deadly Galerina and Pholiotina look very similar.", onset: "Effects usually within an hour.", what_to_do: "Seek medical care for severe agitation, chest pain, or if a deadly lookalike may have been eaten.", source: "Wikipedia: Psilocybe"}
- {taxon: Panaeolus, rank: genus, kingdom: Fungi, toxicity: mild, psychoactive: true, warning: "Some species are psychoactive; small brown lookalikes can be deadly.", onset: "Effects usually within an hour.", what_to_do: "Seek medical care if a deadly lookalike may have been eaten.", source: "Wikipedia: Panaeolus"}
- {taxon: Gymnopilus, rank: genus, kingdom: Fungi, toxicity: mild, psychoactive: true, warning: "Some species are psychoactive; bitter and easily confused with deadly Galerina.", onset: "Effects usually within an hour.", what_to_do: "Seek medical care if a deadly lookalike may have been eaten.", source: "Wikipedia: Gymnopilus"}


- {taxon: Chlorophyllum, rank: genus, kingdom: Fungi, toxicity: serious, warning: "Includes the green-spored parasol, a very common cause of severe vomiting.", onset: "Usually 1–3 hours.", what_to_do: "Seek medical care, especially for children.", source: "Wikipedia: Chlorophyllum"}

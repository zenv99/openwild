name: Region photos (open-licence, 3 per growth stage) -> pack + accuracy

# Collects up to 3 reference photos per growth stage for every species in a region from GBIF (including
# iNaturalist observers' photos), Wikidata and Wikimedia Commons, under the licences in config.PHOTO_LICENSES
# (OpenWild is free and non-commercial: CC0, CC BY, CC BY-SA, CC BY-NC, CC BY-NC-SA; never ND; never PFAF),
# split across parallel machines because
# Commons throttles each connection. Then builds the region pack with the phone's own fingerprint model,
# publishes it as the in-app download and, for Bali, updates the copy shipped inside the app.
run-name: "Photos ${{ inputs.region }} (${{ inputs.topup == 'true' && 'top-up' || 'full' }})"
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id"
        default: "ID-BA"
      max_species:
        description: "Limit species per shard (blank = all). For a quick test."
        default: ""
      publish:
        description: "Publish the pack and update the app (true/false)"
        default: "true"
      topup:
        description: "Only revisit species with fewer than 3 photos (adds iNaturalist and other new photos)"
        default: "false"
      photo_cap:
        description: "Most-observed species to photograph, plus every poisonous/edible one (blank = all)"
        default: ""
      photos:
        description: "Display photos per species in the download"
        default: "12"
      chain:
        description: "After a full run, start a top-up automatically (the scheduler sets false)"
        default: "true"
      fresh:
        description: "Top-up looks again at every species (monthly refresh for new photos)"
        default: "false"
      critical_only:
        description: "Top-up only poisonous/edible plants (urgent safety pass)"
        default: "false"
      merge_runs:
        description: "Also merge the collected photos of these earlier run ids (comma separated)"
        default: ""
      skip_collect:
        description: "Skip collection and rebuild from merge_runs only"
        default: "false"
      force:
        description: "Publish even if the new pack has fewer plants with photos than the published one"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: region-photos-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml
      - name: Species list (from the published pack if the repo has none)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ inputs.region }}"
          if [ ! -f "data/regions/$R/species.csv" ]; then
            gh release download packs -p "$R.owpack" -D /tmp/pk --clobber
            (cd pipeline && python -m openwild_pipeline.cli region-from-pack "$R" "/tmp/pk/$R.owpack")
          fi
          wc -l "data/regions/$R/species.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: region-${{ inputs.region }}
          path: data/regions/${{ inputs.region }}
          retention-days: 3

  collect:
    needs: prepare
    if: inputs.skip_collect != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml pillow
      - uses: actions/download-artifact@v4
        with:
          name: region-${{ inputs.region }}
          path: data/regions/${{ inputs.region }}
      - name: Reuse photos from earlier runs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/photos_commercial/${{ inputs.region }}
            work/cache/http
          key: photos-v2-${{ inputs.region }}-s${{ matrix.shard }}-${{ inputs.max_species != '' && 'test' || 'full' }}-${{ github.run_id }}
          restore-keys: photos-v2-${{ inputs.region }}-s${{ matrix.shard }}-${{ inputs.max_species != '' && 'test' || 'full' }}-
      - name: Restore from the permanent photo store if the cache was cleared (Bali)
        if: steps.cache.outputs.cache-matched-key == '' && inputs.region == 'ID-BA'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ps "work/photos_commercial/${{ inputs.region }}"
          if gh release download photo-store -p "${{ inputs.region }}.tar.part*" -D /tmp/ps; then
            cat /tmp/ps/${{ inputs.region }}.tar.part* | tar -x -C "work/photos_commercial/${{ inputs.region }}"
            rm -rf /tmp/ps
            wc -l "work/photos_commercial/${{ inputs.region }}/photos.csv"
          fi
      - name: Collect photos (shard ${{ matrix.shard }}/6)
        timeout-minutes: 280
        env:
          OW_TIMING: ${{ inputs.max_species != '' && '1' || '' }}
          OW_TOPUP: ${{ inputs.topup == 'true' && '1' || '' }}
          OW_TOPUP_FRESH: ${{ inputs.fresh == 'true' && '1' || '' }}
          OW_CRITICAL_ONLY: ${{ inputs.critical_only == 'true' && '1' || '' }}
          # Several regions run at once: keep iNaturalist at about one request per second in total, and in
          # full passes use it only for poisonous/edible plants and plants with nothing yet.
          OW_INAT_INTERVAL: ${{ inputs.photo_cap != '' && '18' || '6' }}
          OW_INAT_FULL: ${{ inputs.photo_cap != '' && 'critical' || 'all' }}
        run: |
          ARGS="--shard ${{ matrix.shard }}/6"
          if [ -n "${{ inputs.max_species }}" ]; then ARGS="$ARGS --max-species ${{ inputs.max_species }}";
          elif [ -n "${{ inputs.photo_cap }}" ]; then ARGS="$ARGS --max-species $(( (${{ inputs.photo_cap }} + 5) / 6 ))"; fi
          # Soft time budget: stop cleanly before the job limit so everything collected so far is saved and
          # packed; the next (top-up) run carries on from here.
          D="../work/photos_commercial/${{ inputs.region }}"
          mkdir -p "$D"
          if timeout --signal=INT 230m python -m openwild_pipeline.cli commercial-photos "${{ inputs.region }}" $ARGS; then
            echo ok > "$D/status-shard${{ matrix.shard }}.txt"
          else
            echo "::warning::time budget reached; saving what was collected"
            echo budget > "$D/status-shard${{ matrix.shard }}.txt"
          fi
          cp "../work/photos_commercial/${{ inputs.region }}/photos.csv" "../work/photos_commercial/${{ inputs.region }}/photos-shard${{ matrix.shard }}.csv"
      - name: Save photos for the next run (always, even after a failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/photos_commercial/${{ inputs.region }}
            work/cache/http
          key: photos-v2-${{ inputs.region }}-s${{ matrix.shard }}-${{ inputs.max_species != '' && 'test' || 'full' }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photos-${{ inputs.region }}-${{ matrix.shard }}
          path: |
            work/photos_commercial/${{ inputs.region }}/photos-shard${{ matrix.shard }}.csv
            work/photos_commercial/${{ inputs.region }}/status-shard${{ matrix.shard }}.txt
            work/photos_commercial/${{ inputs.region }}/img
          retention-days: 3

  build:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml pytest pillow ai-edge-litert
      - uses: actions/download-artifact@v4
        with:
          name: region-${{ inputs.region }}
          path: data/regions/${{ inputs.region }}
      - uses: actions/download-artifact@v4
        if: inputs.skip_collect != 'true'
        with:
          pattern: photos-${{ inputs.region }}-*
          path: work/photos_commercial/${{ inputs.region }}
          merge-multiple: true
      - name: Merge photos collected by earlier runs
        if: inputs.merge_runs != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ inputs.region }}"
          D="work/photos_commercial/$R"
          mkdir -p "$D/img"
          for RID in $(echo "${{ inputs.merge_runs }}" | tr ',' ' '); do
            gh run download "$RID" -p "photos-$R-*" -D "/tmp/m/$RID"
            for S in /tmp/m/$RID/photos-$R-*; do
              n="${S##*-}"
              cp "$S/photos-shard$n.csv" "$D/photos-shard$n-run$RID.csv"
              cp -rn "$S/img/." "$D/img/" 2>/dev/null || true
            done
            rm -rf "/tmp/m/$RID"
          done
          ls "$D" | head
      - name: Merge shards and report coverage
        run: |
          python - <<'PY'
          import csv, collections, glob
          r = "${{ inputs.region }}"
          d = f"../work/photos_commercial/{r}"
          rows, fields = [], None
          for f in sorted(glob.glob(f"{d}/photos-shard*.csv")):
              with open(f, encoding="utf-8") as fh:
                  rd = csv.DictReader(fh)
                  fields = fields or rd.fieldnames
                  rows += list(rd)
          # The same photo can come from several shards or runs: keep it once per species.
          seen, uniq = set(), []
          for x in rows:
              k = (x["scientific_name"].lower(), x.get("url") or x.get("path"))
              if k not in seen:
                  seen.add(k)
                  uniq.append(x)
          rows = uniq
          with open(f"{d}/photos.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.DictWriter(fh, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          sp = collections.Counter(x["scientific_name"] for x in rows)
          total = sum(1 for _ in open(f"../data/regions/{r}/species.csv", encoding="utf-8")) - 1
          print(f"COVERAGE {len(sp)}/{total} species with photos, {len(rows)} photos")
          print("COVERAGE sources", collections.Counter(x["source"] for x in rows))
          print("COVERAGE licences", collections.Counter(x["license"] for x in rows))
          print("COVERAGE stages", collections.Counter(x["stage"] for x in rows))
          PY
      - name: Build packs (fingerprints with the phone's model) + accuracy report
        if: inputs.publish == 'true' || inputs.max_species != ''
        run: |
          mkdir -p ../work/out ../work/light
          V="$(date -u +%Y%m%d%H)"
          # Full download: up to 12 display photos per species (3 per growth stage); accuracy report.
          # Part-by-part facts from Wikipedia, if this region has none yet (used by the pack build).
          if [ ! -f "../content/evidence/wiki_parts/${{ inputs.region }}.csv" ]; then
            python -m openwild_pipeline.cli wiki-parts "${{ inputs.region }}" --max 6000 || true
          fi
          python -m openwild_pipeline.cli commercial-pack "${{ inputs.region }}" --version "$V" --photos "${{ inputs.photos || '12' }}" \
            --out "../work/out/${{ inputs.region }}.owpack" --evaluate "../data/regions/${{ inputs.region }}/eval"
          # Light copy shipped inside the app: first 3 photos (one per stage); fewer if it would not fit in git
          # (GitHub refuses files over 100 MB). The full pack is always one tap away in the Packs tab.
          for N in $([ "${{ inputs.region }}" = "ID-BA" ] && echo "3 2 1"); do
            python -m openwild_pipeline.cli commercial-pack "${{ inputs.region }}" --version "$V" --photos $N \
              --out "../work/light/${{ inputs.region }}.owpack"
            SZ=$(stat -c %s "../work/light/${{ inputs.region }}.owpack")
            echo "LIGHT photos=$N size=$((SZ/1000000)) MB"
            [ "$SZ" -lt 90000000 ] && break
          done
          python - <<'PY'
          import sqlite3
          import os
          for kind in [k for k in ("out", "light") if os.path.exists(f"../work/{k}/${{ inputs.region }}.owpack")]:
              c = sqlite3.connect(f"../work/{kind}/${{ inputs.region }}.owpack")
              print("PACK", kind, "species", c.execute("SELECT COUNT(*) FROM species").fetchone()[0],
                    "with photos", c.execute("SELECT COUNT(DISTINCT species_id) FROM photo").fetchone()[0],
                    "photos", c.execute("SELECT COUNT(*) FROM photo").fetchone()[0],
                    "with photo ID", c.execute("SELECT COUNT(DISTINCT species_id) FROM prototype").fetchone()[0],
                    "stages", dict(c.execute("SELECT stage, COUNT(*) FROM photo GROUP BY stage")))
          PY
          ls -la ../work/out ../work/light
          cat "../data/regions/${{ inputs.region }}/eval/ACCURACY.md" | head -30
      - name: Publish as the in-app download (release "packs")
        if: inputs.publish == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ inputs.region }}"
          mkdir -p work/idx
          gh release download packs -p index.json -D work/idx --clobber || echo '{"packs": []}' > work/idx/index.json
          # Never replace a pack with one that has noticeably fewer plants with photos (e.g. a cleared cache).
          python3 - <<'PY'
          import json, sqlite3, sys
          r = "${{ inputs.region }}"
          new = sqlite3.connect(f"work/out/{r}.owpack").execute(
              "SELECT COUNT(DISTINCT species_id) FROM photo WHERE stage NOT IN ('specimen', 'related')").fetchone()[0]
          old = next((p.get("photo_species") or 0 for p in json.load(open("work/idx/index.json"))["packs"] if p["region_id"] == r), 0)
          print(f"GUARD {r}: new pack {new} plants with photos, published {old}")
          if new < 0.95 * old and "${{ inputs.force }}" != "true":
              print(f"::error::refusing to publish: {new} < {old} plants with photos (set force=true to override)")
              sys.exit(1)
          PY
          (cd pipeline && python -m openwild_pipeline.cli pack-index --pack ../work/out/$R.owpack --index ../work/idx/index.json \
            --url "https://github.com/${{ github.repository }}/releases/download/packs/$R.owpack")
          gh release upload packs "work/out/$R.owpack" work/idx/index.json --clobber
          # Progress for the scheduler: did any shard stop at its time budget? (then more passes are needed)
          gh release download packs -p photo-progress.json -D work/idx --clobber || echo '{}' > work/idx/photo-progress.json
          python3 - <<'PY'
          import glob, json, re, time
          r, mode = "${{ inputs.region }}", "${{ inputs.topup == 'true' && 'topup' || 'full' }}"
          st = [open(f).read().strip() for f in glob.glob(f"work/photos_commercial/{r}/status-shard*.txt")]
          acc = ""
          try:
              acc = re.search(r"Right plant shown first: ([0-9.]+%)", open(f"data/regions/{r}/eval/ACCURACY.md").read()).group(1)
          except Exception:
              pass
          prog = json.load(open("work/idx/photo-progress.json"))
          e = prog.get(r, {})
          e.update({"mode": mode, "budget_hit": "budget" in st or not st, "top1": acc, "updated": time.strftime("%Y-%m-%dT%H:%MZ", time.gmtime()),
                    "passes": e.get("passes", 0) + 1, "topups": e.get("topups", 0) + (mode == "topup")})
          prog[r] = e
          json.dump(prog, open("work/idx/photo-progress.json", "w"), indent=1, sort_keys=True)
          print("PROGRESS", r, e)
          PY
          gh release upload packs work/idx/photo-progress.json --clobber
          # Bali: keep every collected photo in a permanent store (caches can be cleared by GitHub).
          if [ "$R" = "ID-BA" ]; then
            gh release view photo-store >/dev/null 2>&1 || gh release create photo-store --prerelease --title "Collected photos (pipeline store)" --notes "Pipeline working store. Not for users."
            (cd "work/photos_commercial/$R" && tar -c photos.csv img) | split -b 1900m -d - "/tmp/$R.tar.part"
            for old in $(gh release view photo-store --json assets --jq '.assets[].name' | grep "^$R.tar.part" || true); do gh release delete-asset photo-store "$old" -y; done
            gh release upload photo-store /tmp/$R.tar.part* --clobber
          fi
      - name: Update the copy shipped in the app, commit, rebuild the app
        if: inputs.publish == 'true' && inputs.region == 'ID-BA'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ inputs.region }}"
          # Start from the newest main (another run may have committed meanwhile), keeping this run's outputs.
          mkdir -p /tmp/keep && cp -r "data/regions/$R/eval" /tmp/keep/eval
          git fetch -q origin main && git reset -q --hard origin/main
          mkdir -p "data/regions/$R" && rm -rf "data/regions/$R/eval" && cp -r /tmp/keep/eval "data/regions/$R/eval"
          SZ=$(stat -c %s "work/light/$R.owpack")
          if [ "$SZ" -ge 95000000 ]; then
            echo "::warning::light pack $((SZ/1000000)) MB is too big for git; keeping the bundled copy, the full pack is published"
          else
            cp "work/light/$R.owpack" "android/app/src/main/assets/packs/$R.owpack"
          fi
          (cd pipeline && python - <<'PY'
          from pathlib import Path
          import sqlite3
          from openwild_pipeline.commercial_photos import _write_catalog
          p = Path("../android/app/src/main/assets/packs/ID-BA.owpack")
          v = int(dict(sqlite3.connect(p).execute("SELECT key, value FROM meta"))["pack_version"])
          _write_catalog(p, "ID-BA", v)
          PY
          )
          git config user.name "openwild-data-bot"
          git config user.email "openwild-data-bot@users.noreply.github.com"
          (cd pipeline && python -m openwild_pipeline.cli photos-wanted "$R" --top 300 --out "../docs/photos-wanted/$R.md")
          git add android/app/src/main/assets/packs/ "data/regions/$R/eval" docs/photos-wanted
          git commit -m "Bali pack: more photos per growth stage, more species, photo-ID accuracy report" || echo "No changes"
          git push origin HEAD:main
          gh workflow run android.yml --ref main
          if [ "${{ inputs.topup }}" != "true" ] && [ "${{ inputs.chain }}" != "false" ]; then
            gh workflow run bali-photos.yml --ref main -f region="$R" -f max_species="" -f publish=true -f topup=true
          fi

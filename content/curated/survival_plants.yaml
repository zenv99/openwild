# SEED CONTENT — NOT YET EXPERT REVIEWED.

- scientific_name: Typha latifolia
  edibility: edible
  toxicity: none
  psychoactive: false
  if_eaten:
    benefits:
      nutrition: "Rhizomes are rich in starch; young shoots and immature flower spikes are also eaten."
      edible_parts: [rhizomes, young shoots, immature flower spikes, pollen]
      preparation_required: "Best cooked. Only harvest from clean water; cattails absorb pollutants."
      traditional_uses:
        - {text: "Seed fluff used as fire tinder and insulation; leaves woven into mats and shelters.", source: "Wikipedia: Typha latifolia"}
    feeling:
      taste_texture: "Shoots taste mild, like cucumber; rhizome starch is bland and fibrous."
  survival:
    priority: high_value
    uses: [food, fire, shelter, cordage]
  lookalikes:
    - {name: Iris pseudacorus, danger: toxic}
  sources: ["Wikipedia: Typha latifolia"]
  review: {status: unreviewed}

- scientific_name: Cocos nucifera
  edibility: edible
  toxicity: none
  psychoactive: false
  if_eaten:
    benefits:
      nutrition: "Young coconut water provides fluid and electrolytes; mature flesh is high in fat and calories."
      edible_parts: [coconut water, flesh, palm heart]
      preparation_required: null
      traditional_uses:
        - {text: "Husk fibre (coir) used for cordage and fire; fronds for shelter.", source: "Wikipedia: Coconut"}
    feeling:
      taste_texture: "Sweet, refreshing water; firm, rich flesh. Large amounts of water from mature nuts can cause diarrhoea."
  survival:
    priority: high_value
    uses: [food, water, fire, shelter, cordage]
  sources: ["Wikipedia: Coconut"]
  review: {status: unreviewed}


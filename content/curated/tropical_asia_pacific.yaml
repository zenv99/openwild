      onset: "Immediately on contact.",
      severity: "Pencil cactus / firestick plant. Common hedge plant in the tropics.",
      what_to_do: "Flush eyes or skin with clean water for at least 15 minutes and seek medical care."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Euphorbia tirucalli"]

- scientific_name: Dieffenbachia seguine
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [leaves, stems], cooking_makes_safe: false,

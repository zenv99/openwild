name: Photo model + region photo pack (free, CPU)

# Free on-phone photo ID with no GPU and no training:
#  1. exports DINOv2-small (Apache-2.0) to android/app/src/main/assets/embedder.tflite
#  2. downloads reference photos already pinned in data/regions/<id>/photo_manifest.csv
#     (a full GBIF recrawl is only used for regions that do not have a manifest yet)
#  3. fingerprints them on CPU and builds the region pack (photos + photo ID + safety info)
#  4. publishes the pack as a download (GitHub release "packs" + index.json the app reads)
#  5. commits the model if it changed -> the Android workflow builds a new OpenWild.apk
#
# Photo-only updates (no new APK): dispatch this workflow with export_model false.
# New species photos are added first by photo-batch.yml, not by crawling the whole backlog here.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id (e.g. ID-BA for Bali)"
        required: true
        default: "ID-BA"
      per_species:
        description: "Reference photos per species"
        required: true
        default: "8"
      export_model:
        description: "Re-export the model (true/false)"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: photo-model
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse photos downloaded in earlier runs
        uses: actions/cache@v4
        with:
          path: |
            work/photos_gbif/${{ inputs.region }}/img
            work/cache/http
          key: photos-${{ inputs.region }}-${{ github.run_id }}
          restore-keys: photos-${{ inputs.region }}-
      - name: Install (CPU)
        run: |
          pip install --upgrade pip
          pip install litert-torch ai-edge-quantizer timm pillow numpy pyyaml
          python -c "import torch, timm, litert_torch; print('torch', torch.__version__, 'timm', timm.__version__)"
      - name: Export free model (DINOv2-small -> LiteRT)
        if: inputs.export_model == 'true'
        run: python -m openwild_pipeline.cli free-model
      - name: Reference photos (pinned credits + weekly manifest; not the unfetched backlog)
        run: python -m openwild_pipeline.cli photos "${{ inputs.region }}" --per-species "${{ inputs.per_species }}" --workers 4
      - name: Fingerprint photos + build region pack
        run: |
          mkdir -p ../work/out
          python -m openwild_pipeline.cli photo-pack "${{ inputs.region }}" --version "$(date -u +%Y%m%d%H)" --photos-shown 3 \
            --out ../work/out/${{ inputs.region }}.owpack
      - name: Publish pack for in-app download (release "packs")
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ inputs.region }}"
          gh release view packs >/dev/null 2>&1 || gh release create packs --prerelease --title "Region packs (downloaded inside the app)" \
            --notes "Region packs for OpenWild: species, photos, photo ID and safety info. The app downloads these itself (Packs tab) and checks each file's SHA-256 before installing."
          mkdir -p work/idx
          gh release download packs -p index.json -D work/idx --clobber || echo '{"packs": []}' > work/idx/index.json
          (cd pipeline && python -m openwild_pipeline.cli pack-index --pack ../work/out/$R.owpack --index ../work/idx/index.json \
            --url "https://github.com/${{ github.repository }}/releases/download/packs/$R.owpack")
          gh release upload packs "work/out/$R.owpack" work/idx/index.json --clobber
      - name: Commit model
        if: inputs.export_model == 'true'
        working-directory: .
        run: |
          git config user.name "openwild-data-bot"
          git config user.email "openwild-data-bot@users.noreply.github.com"
          git add android/app/src/main/assets/embedder.tflite android/app/src/main/assets/embedder.json
          git commit -m "Photo ID model refresh" || echo "No changes"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Build the app with the new model (dispatch Android workflow)
        if: inputs.export_model == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main || true

# GROUP SAFETY RULES — NOT YET EXPERT REVIEWED.
# Applied to any species in a pack that has NO species-level entry in content/curated/:
# species entry > genus rule > family rule. Rules only ever WARN: they never unlock eating
# information (SafetyPolicy shows "Treat as unsafe"). Keep warnings general and conservative.
#
# Fields: taxon, rank (genus|family), kingdom, toxicity (mild|serious|deadly), psychoactive (optional),
#         warning (what the danger is), onset, what_to_do, source

# ---------------- FUNGI: genera ----------------
- {taxon: Amanita, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "This genus includes the death cap and destroying angels, which cause most fatal mushroom poisonings. Several species are also psychoactive and toxic.", onset: "Amatoxin symptoms usually start 6–24 hours after eating, followed by a false recovery.", what_to_do: "Seek emergency medical care immediately, even without symptoms.", source: "Wikipedia: Amanita"}
- {taxon: Galerina, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Small brown wood-loving mushrooms; several contain deadly amatoxins.", onset: "Usually 6–24 hours after eating.", what_to_do: "Seek emergency medical care immediately.", source: "Wikipedia: Galerina"}
- {taxon: Lepiota, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Many small Lepiota species contain deadly amatoxins.", onset: "Usually 6–24 hours after eating.", what_to_do: "Seek emergency medical care immediately.", source: "Wikipedia: Lepiota"}
- {taxon: Pholiotina, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Some species contain deadly amatoxins.", onset: "Usually 6–24 hours after eating.", what_to_do: "Seek emergency medical care immediately.", source: "Wikipedia: Pholiotina"}
- {taxon: Conocybe, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Small lawn mushrooms; some contain deadly amatoxins.", onset: "Usually 6–24 hours after eating.", what_to_do: "Seek emergency medical care immediately.", source: "Wikipedia: Conocybe"}
- {taxon: Cortinarius, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Huge genus (webcaps); some species cause irreversible kidney failure.", onset: "Very delayed: often 2–4 days, up to 3 weeks.", what_to_do: "Seek medical care as soon as you suspect it, even days later.", source: "Wikipedia: Cortinarius"}
- {taxon: Inocybe, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Fibrecaps; many contain muscarine causing sweating, salivation, slow heartbeat; some can kill.", onset: "Fast: usually 15–30 minutes.", what_to_do: "Seek emergency medical care; an antidote exists.", source: "Wikipedia: Inocybe"}
- {taxon: Clitocybe, rank: genus, kingdom: Fungi, toxicity: serious, warning: "Several funnel caps contain muscarine.", onset: "Usually 15–30 minutes.", what_to_do: "Seek medical care.", source: "Wikipedia: Clitocybe"}
- {taxon: Gyromitra, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "False morels contain gyromitrin, which can damage liver and nerves.", onset: "Usually 6–12 hours.", what_to_do: "Seek emergency medical care.", source: "Wikipedia: Gyromitra"}
- {taxon: Paxillus, rank: genus, kingdom: Fungi, toxicity: deadly, warning: "Roll-rims can trigger a fatal immune reaction, sometimes after being eaten safely before.", onset: "Usually 1–2 hours.", what_to_do: "Seek medical care.", source: "Wikipedia: Paxillus involutus"}
- {taxon: Entoloma, rank: genus, kingdom: Fungi, toxicity: serious, warning: "Pinkgills; several cause severe gastrointestinal poisoning.", onset: "Usually 30 minutes to 4 hours.", what_to_do: "Seek medical care.", source: "Wikipedia: Entoloma"}

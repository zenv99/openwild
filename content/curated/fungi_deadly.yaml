# Schema: docs/CONTENT_SCHEMA.md   Rules: SAFETY.md

- scientific_name: Amanita phalloides
  edibility: deadly
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Severe vomiting, watery diarrhoea and abdominal pain, then an apparent recovery, then liver and kidney failure."
      onset: "Usually 6–24 hours after eating. A false recovery often follows on day 2–3 while the liver is failing."
      severity: "A leading cause of fatal mushroom poisoning worldwide. A single cap can kill an adult."
      what_to_do: "Seek emergency medical care immediately, even if you feel fine. Tell doctors you may have eaten a death cap (amatoxin). Keep a sample of the mushroom."
    feeling:
      taste_texture: "Survivors report it tasted pleasant. Taste gives no warning."
  survival:
    priority: avoid
  lookalikes:
    - {name: Volvariella volvacea, danger: edible}
    - {name: Agaricus campestris, danger: edible}
    - {name: Russula spp., danger: edible}
    - {name: Amanita citrina, danger: harmless}
  sources: ["Wikipedia: Amanita phalloides"]
  review: {status: unreviewed}

- scientific_name: Amanita bisporigera
  edibility: deadly
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Severe vomiting and diarrhoea, false recovery, then liver and kidney failure."
      onset: "Usually 6–24 hours after eating, with a false recovery on day 2–3."

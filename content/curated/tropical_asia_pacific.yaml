- scientific_name: Lantana camara
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [unripe green berries, leaves], cooking_makes_safe: false,
      symptoms: "Vomiting, diarrhoea, weakness, breathing difficulty; leaves can damage the liver.",
      onset: "Usually within a few hours.",
      severity: "Very common weedy shrub worldwide. Children are poisoned by the green berries.",
      what_to_do: "Seek medical care, especially for children."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Lantana camara"]

- scientific_name: Cycas revoluta
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [seeds, all parts], cooking_makes_safe: false,
      symptoms: "Vomiting and diarrhoea, then liver failure; nerve damage can follow.",
      onset: "Vomiting usually within hours; liver damage over the next days.",
      severity: "Cycad, often called 'sago palm' though it is not one. Potentially fatal.",
      what_to_do: "Seek emergency medical care immediately, even if symptoms seem mild."}
  survival: {priority: avoid}
  lookalikes: [{name: Metroxylon sagu, danger: edible}]
  sources: ["Wikipedia: Cycas revoluta"]

- scientific_name: Brugmansia suaveolens
  edibility: deadly
  toxicity: deadly
  psychoactive: true
  if_eaten:
    harms: {toxic_parts: [all parts, especially seeds and leaves], cooking_makes_safe: false,
      symptoms: "Dry mouth, dilated pupils, fast heartbeat, fever, confusion, severe delirium, seizures.",
      onset: "Usually within 30 minutes to a few hours; effects can last days.",
      severity: "Angel's trumpet. Common garden plant in the tropics. Toxicity is wildly unpredictable.",
      what_to_do: "Seek emergency medical care immediately. Keep the person safe and supervised."}
    feeling:
      effects: "Severe delirium: people talk to things that aren't there and cannot tell what is real."
      risks: "Frequently terrifying; injuries, drownings and deaths occur. Memory of the episode is often lost."
  survival: {priority: avoid}
  lookalikes: [{name: Datura stramonium, danger: deadly}]
  sources: ["Wikipedia: Brugmansia suaveolens"]

- scientific_name: Mitragyna speciosa
  edibility: psychoactive
  toxicity: serious
  psychoactive: true
  if_eaten:
    harms: {toxic_parts: [leaves], cooking_makes_safe: false,
      symptoms: "Nausea, vomiting, constipation, drowsiness, fast heartbeat; rarely seizures.",
      onset: "Usually within an hour.",
      severity: "Kratom. Serious harm and deaths are reported, especially combined with other substances. Dependence occurs with regular use.",
      what_to_do: "Seek medical care for seizures, breathing difficulty or severe drowsiness."}
    feeling:
      effects: "Reported effects range from stimulation to opioid-like sedation."
      risks: "Dependence and withdrawal; dangerous combined with alcohol or other drugs. Legal status varies widely by country."
  survival: {priority: avoid}
  sources: ["Wikipedia: Mitragyna speciosa"]

# ---------- edible only with preparation ----------
- scientific_name: Colocasia esculenta
  edibility: edible_with_preparation
  toxicity: mild
  if_eaten:
    harms: {toxic_parts: [raw corms, raw leaves], cooking_makes_safe: true,
      symptoms: "Raw taro causes burning and itching of mouth and throat."}
    benefits:
      nutrition: "Corms are a starchy staple; leaves are eaten as greens once well cooked."
      edible_parts: [corms, leaves, stems]
      preparation_required: "Always cook thoroughly; never eat raw. Boil leaves well."
    feeling: {taste_texture: "Cooked corms are starchy and slightly nutty."}
  survival: {priority: high_value, uses: [food]}
  lookalikes: [{name: Alocasia macrorrhizos, danger: toxic}, {name: Dieffenbachia seguine, danger: toxic}]
  sources: ["Wikipedia: Taro"]

- scientific_name: Dioscorea hispida
  edibility: edible_with_preparation
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [raw tubers], cooking_makes_safe: false,
      symptoms: "Nausea, vomiting, dizziness, drowsiness; in severe cases convulsions.",
      onset: "Usually within a few hours.",
      severity: "Asiatic bitter yam. Only edible after lengthy traditional detoxification by soaking in running water for days.",
      what_to_do: "Seek medical care for any symptoms."}
    benefits:
      nutrition: "Starchy tuber used as famine food."
      edible_parts: [tubers]
      preparation_required: "Requires slicing, prolonged soaking in running water and cooking. Do not attempt without local expertise."
  survival: {priority: use_with_caution, uses: [food]}
  sources: ["Wikipedia: Dioscorea hispida"]

- scientific_name: Pangium edule
  edibility: edible_with_preparation
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [raw seeds, fruit, leaves], cooking_makes_safe: false,
      symptoms: "Cyanide poisoning: headache, dizziness, rapid breathing, vomiting, collapse.",
      onset: "Within minutes to a few hours.",
      severity: "Kepayang / keluak. Raw seeds can be fatal.",
      what_to_do: "Seek emergency medical care immediately."}
    benefits:
      nutrition: "Fermented seeds (kluwak) are a traditional Indonesian ingredient."
      edible_parts: [fermented seeds]
      preparation_required: "Only edible after traditional boiling and weeks of fermentation that removes cyanide. Never eat raw or improvised."
  survival: {priority: avoid}
  sources: ["Wikipedia: Pangium edule"]

- scientific_name: Bambusa vulgaris
  edibility: edible_with_preparation
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [raw shoots], cooking_makes_safe: true,
      symptoms: "Raw shoots release cyanide: headache, dizziness, nausea, rapid breathing.",
      onset: "Within minutes to a few hours.",
      severity: "Raw bamboo shoots can be dangerous; properly cooked shoots are a common food.",
      what_to_do: "Seek medical care for any symptoms after eating raw or undercooked shoots."}
    benefits:
      nutrition: "Young shoots are low in calories but provide fibre and some nutrients."
      edible_parts: [young shoots]
      preparation_required: "Peel and slice young shoots, then boil thoroughly, discarding the water."
  survival: {priority: high_value, uses: [food, shelter, water, fire]}
  sources: ["Wikipedia: Bamboo shoot"]

- scientific_name: Metroxylon sagu
  edibility: edible_with_preparation
  toxicity: none
  if_eaten:
    benefits:
      nutrition: "The trunk pith yields large amounts of starch (sago), a high-calorie staple."
      edible_parts: [pith starch, palm heart]
      preparation_required: "Pith is pounded and washed to extract the starch, which is then cooked."
      traditional_uses: [{text: "Leaves used for thatch and walls.", source: "Wikipedia: Metroxylon sagu"}]
  survival: {priority: high_value, uses: [food, shelter]}
  lookalikes: [{name: Cycas revoluta, danger: deadly}]
  sources: ["Wikipedia: Metroxylon sagu"]


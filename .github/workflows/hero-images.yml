name: Landing-page photos (Wikimedia Commons, open licences only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_hero_images.py
      - name: Commit
        run: |
          git config user.name "openwild-data-bot"
          git config user.email "openwild-data-bot@users.noreply.github.com"
          git add android/app/src/main/res/drawable-nodpi android/app/src/main/assets/hero_credits.json
          git commit -m "Landing-page photos from Wikimedia Commons (open licences, credited)" || echo "No changes"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

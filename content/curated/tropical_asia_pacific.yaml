      onset: "Immediately on chewing.",
      severity: "Dumb cane. Swelling can rarely block breathing.",
      what_to_do: "Rinse the mouth. Seek urgent care if breathing or swallowing is difficult."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Dieffenbachia"]

- scientific_name: Alocasia macrorrhizos
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [all parts when raw], cooking_makes_safe: false,

# Region definitions.
# - id:      stable id used in pack filenames and the app
# - gbif:    GBIF occurrence-search filter defining the region's species list
#            (country = ISO 3166-1 alpha-2; gadmGid = GADM level-1 id for subdivisions)
# - bbox:    one or more [min_lon, min_lat, max_lon, max_lat] boxes used by the app's
#            offline region locator (smallest containing box wins; user can override).
# - max_species: cap on species in the pack (most-observed first)
#
# Seed list. Add every country (and subdivisions for very large countries) over time:
# `python -m openwild_pipeline.cli regions-from-naturalearth <admin0.geojson>` generates entries.

regions:
  - id: WORLD
    name: World (common species)
    gbif: {}
    bbox: [[-180, -90, 180, 90]]
    max_species: 3000

  - id: PH
    name: Philippines
    gbif: {country: PH}
    bbox: [[116.9, 4.5, 126.7, 21.2]]
    max_species: 6000


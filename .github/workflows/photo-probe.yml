name: Photo probe (exact plants, any licence)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pyyaml pillow
      - name: Lightning address check
        run: curl -sS -m 30 https://cake.cash/.well-known/lnurlp/zenv9 | head -c 600; echo

# ---------- edible ----------
- scientific_name: Allium ursinum
  edibility: edible
  toxicity: none
  if_eaten:
    benefits:
      nutrition: "Wild garlic. Leaves, flowers and bulbs are edible raw or cooked."
      edible_parts: [leaves, flowers, bulbs]
      preparation_required: "Crush a leaf: it must smell strongly of garlic. No garlic smell means do not eat."
    feeling: {taste_texture: "Strong garlic flavour."}
  survival: {priority: high_value, uses: [food]}
  lookalikes:
    - {name: Convallaria majalis, danger: deadly}
    - {name: Colchicum autumnale, danger: deadly}
    - {name: Arum maculatum, danger: toxic}

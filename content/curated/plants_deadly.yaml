- scientific_name: Jatropha curcas
  edibility: toxic
  toxicity: serious
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [seeds, sap]
      cooking_makes_safe: false
      symptoms: "Burning throat, severe vomiting and diarrhoea, dehydration."
      onset: "Usually within an hour or two."
      severity: "Seeds look and taste like nuts; children are often poisoned."
      what_to_do: "Seek medical care, especially for children. Sip clean water to avoid dehydration."
  survival: {priority: avoid}
  sources: ["Wikipedia: Jatropha curcas"]
  review: {status: unreviewed}

# SEED CONTENT — NOT YET EXPERT REVIEWED. Tropical Asia & Pacific.
# Schema: docs/CONTENT_SCHEMA.md   Rules: SAFETY.md

# ---------- dangerous ----------
- scientific_name: Cerbera manghas
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [seeds, fruit, sap], cooking_makes_safe: false,
      symptoms: "Vomiting, slow and irregular heartbeat, collapse.",
      onset: "Usually within a few hours.",
      severity: "Frequently fatal. Coastal tree with mango-like fruit, close relative of the pong-pong tree.",
      what_to_do: "Seek emergency medical care immediately. Heart monitoring is needed."}
  survival: {priority: avoid}
  lookalikes: [{name: Cerbera odollam, danger: deadly}, {name: Mangifera indica, danger: edible}]
  sources: ["Wikipedia: Cerbera manghas"]

- scientific_name: Cascabela thevetia
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts, especially seeds], cooking_makes_safe: false,
      symptoms: "Burning mouth, vomiting, diarrhoea, dizziness, dangerously slow or irregular heartbeat.",
      onset: "Usually within a few hours.",
      severity: "Yellow oleander. A common ornamental and a frequent cause of fatal poisoning in South Asia.",
      what_to_do: "Seek emergency medical care immediately. Heart monitoring is needed."}
  survival: {priority: avoid}
  lookalikes: [{name: Nerium oleander, danger: deadly}]
  sources: ["Wikipedia: Cascabela thevetia"]

- scientific_name: Strychnos nux-vomica
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [seeds, bark], cooking_makes_safe: false,
      symptoms: "Agitation, then violent muscle spasms and convulsions while awake, breathing failure.",
      onset: "Fast: often within 15–60 minutes.",
      severity: "Seeds contain strychnine. Frequently fatal.",
      what_to_do: "Seek emergency medical care immediately. Keep the person quiet and still; noise and touch can trigger spasms."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Strychnos nux-vomica"]

- scientific_name: Antiaris toxicaria
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [latex, seeds], cooking_makes_safe: false,
      symptoms: "Vomiting, slow and irregular heartbeat, collapse.",
      onset: "Usually within minutes to a few hours.",
      severity: "Upas tree. Its latex was used as an arrow poison. Potentially fatal.",
      what_to_do: "Seek emergency medical care immediately. Wash any latex off skin."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Antiaris"]

- scientific_name: Excoecaria agallocha
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [milky sap, smoke from burning], cooking_makes_safe: false,
      symptoms: "Sap blisters skin and can cause temporary or permanent blindness if it reaches the eyes.",
      onset: "Immediately on contact.",
      severity: "'Blind-your-eye' mangrove. Do not burn it or rub your eyes after touching it.",
      what_to_do: "Flush eyes or skin with clean water for at least 15 minutes and seek medical care."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Excoecaria agallocha"]

- scientific_name: Calotropis gigantea
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [milky sap, leaves, all parts], cooking_makes_safe: false,
      symptoms: "Vomiting, diarrhoea, slow heartbeat; sap causes severe eye inflammation.",
      onset: "Usually within a few hours; eye pain immediately.",
      severity: "Crown flower. Contains heart toxins.",
      what_to_do: "Seek medical care. Flush eyes or skin with clean water."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Calotropis gigantea"]

- scientific_name: Euphorbia tirucalli
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [milky sap], cooking_makes_safe: false,

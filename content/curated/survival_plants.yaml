- scientific_name: Urtica dioica
  edibility: edible_with_preparation
  toxicity: mild
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [stinging hairs on raw leaves and stems]
      cooking_makes_safe: true
      symptoms: "Raw plant stings skin and mouth: burning, itching, rash."
    benefits:
      nutrition: "Cooked young leaves are nutritious, rich in protein, iron and vitamins."
      edible_parts: [young leaves, shoots]
      preparation_required: "Cook, boil or thoroughly dry before eating to destroy the stinging hairs. Avoid old plants in flower."
      traditional_uses:
        - {text: "Stem fibres used for cordage and fabric.", source: "Wikipedia: Urtica dioica"}
    feeling:
      taste_texture: "Cooked leaves taste like spinach."
  survival:
    priority: high_value
    uses: [food, cordage]
  sources: ["Wikipedia: Urtica dioica"]
  review: {status: unreviewed}

- scientific_name: Manihot esculenta
  edibility: edible_with_preparation
  toxicity: serious
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [raw roots, raw leaves, especially peel]
      cooking_makes_safe: true
      symptoms: "Raw or poorly prepared cassava releases cyanide: dizziness, headache, vomiting, rapid breathing, collapse."
      onset: "Usually within a few hours."
      severity: "Can be fatal when eaten raw or badly prepared. Bitter varieties are most dangerous."
      what_to_do: "Seek emergency medical care for any symptoms after eating cassava."
    benefits:
      nutrition: "Major source of calories (starch) in the tropics; leaves are high in protein when properly cooked."
      edible_parts: [roots, leaves]
      preparation_required: "Never eat raw. Peel, then soak and cook thoroughly; discard soaking and cooking water. Leaves must be pounded and boiled well."
    feeling:
      taste_texture: "Starchy and mild, like potato, once cooked."
  survival:
    priority: use_with_caution
    uses: [food]
  sources: ["Wikipedia: Cassava"]
  review: {status: unreviewed}

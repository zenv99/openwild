- scientific_name: Gloriosa superba
  edibility: deadly
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [all parts, especially tubers]
      cooking_makes_safe: false
      symptoms: "Severe vomiting and diarrhoea, then multi-organ failure."

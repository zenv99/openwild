name: Android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches ~/.gradle (dependencies and wrappers) and restores it on the next run.
      # setup-java's cache: gradle writes the same directory, so it is not enabled here.
      - uses: gradle/actions/setup-gradle@v4
      - name: Private release key (from GitHub secrets; absent on forks and pull requests)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "OW_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release key: present"
          else
            echo "Release key: not set, using the public dev key"
          fi
      - name: Unit tests and release APK
        env:
          OW_BUILD_NUMBER: ${{ github.run_number }}
          OW_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          OW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          OW_INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          # GitHub already runs this step with pipefail. A 429 from Maven Central fails the
          # download; wait and try again. A test or compile failure still stops immediately.
          log="${RUNNER_TEMP}/gradle-attempt.log"
          attempt=1
          max=4
          while true; do
            set +e
            ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE '429|Too Many Requests|Could not resolve|Could not GET|Read timed out|Connection reset' "$log"; then
              echo "Gradle failed for a reason other than a dependency download."
              exit "$code"
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "Dependency download still failing after $max attempts."
              exit "$code"
            fi
            wait=$((attempt * 45))
            echo "Maven Central rate-limited or dropped the download. Waiting ${wait}s, then attempt $((attempt + 1)) of $max."
            sleep "$wait"
            attempt=$((attempt + 1))
          done
      - name: Signing certificate
        run: |
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          FP=$(grep -m1 "SHA-256 digest" certs.txt | sed 's/.*: //')
          echo "OW_CERT_SHA256=$FP" >> "$GITHUB_ENV"
          if [ -n "${OW_KEYSTORE:-}" ]; then echo "OW_SIGNED=release" >> "$GITHUB_ENV"; else echo "OW_SIGNED=dev" >> "$GITHUB_ENV"; fi
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Security gate (permissions, HTTPS only, not debuggable, no backup)
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          APK=app/build/outputs/apk/release/app-release.apk
          $AAPT dump badging $APK > badging.txt
          $AAPT dump xmltree $APK AndroidManifest.xml > manifest.txt
          echo "Permissions:"; grep "uses-permission" badging.txt || true
          # Only these permissions are allowed. INTERNET is for region downloads from GitHub only (PackManager.ALLOWED_HOSTS).
          ALLOWED="android.permission.CAMERA android.permission.ACCESS_COARSE_LOCATION android.permission.INTERNET org.openwild.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for p in $(grep "uses-permission" badging.txt | sed "s/.*name='\([^']*\)'.*/\1/"); do
            echo " $ALLOWED " | grep -q " $p " || { echo "FAIL: unexpected permission $p"; exit 1; }
          done
          if grep -q "application-debuggable" badging.txt; then echo "FAIL: debuggable build"; exit 1; fi
          grep "allowBackup" manifest.txt || true
          if grep "allowBackup" manifest.txt | grep -q "0xffffffff"; then echo "FAIL: backup enabled"; exit 1; fi
          if grep "usesCleartextTraffic" manifest.txt | grep -q "0xffffffff"; then echo "FAIL: plain http allowed"; exit 1; fi
          grep -q "networkSecurityConfig" manifest.txt || { echo "FAIL: no network security config"; exit 1; }
          # Network code may only live in PackManager (region downloads) and PhotoInbox (photos the user
          # agreed to send), and PhotoInbox may only talk to api.github.com.
          HITS=$(grep -rlE "HttpURLConnection|java\.net\.URL\b|okhttp|Socket\(" app/src/main/java | grep -v -e "pack/PackManager.kt" -e "ui/PhotoInbox.kt" || true)
          if [ -n "$HITS" ]; then echo "FAIL: network code outside PackManager/PhotoInbox: $HITS"; exit 1; fi
          if grep -oE "https?://[a-zA-Z0-9.-]+" app/src/main/java/org/openwild/app/ui/PhotoInbox.kt | grep -v "^https://api.github.com$"; then echo "FAIL: PhotoInbox talks to another host"; exit 1; fi
          echo "PASS: only allowed permissions, HTTPS-only, network code only in PackManager/PhotoInbox, not debuggable, backup off"
      - uses: actions/upload-artifact@v4
        with:
          name: openwild-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish installable APK (versioned release + "app-latest")
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VER="0.7.${OW_BUILD_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk OpenWild.apk
          NOTES="OpenWild ${VER}. Goes online only to download regions from GitHub; HTTPS only, not debuggable, no cloud backup (checked automatically on every build).
          Install: download OpenWild.apk on your Android phone, open it, allow installing from this source.
          Automatic updates: install Obtainium (free, open source) and add https://github.com/zenv99/openwild
          Signed with the ${OW_SIGNED} key. Certificate SHA-256: ${OW_CERT_SHA256}"
          # Versioned release: what updaters such as Obtainium follow.
          gh release create "v${VER}" OpenWild.apk --title "OpenWild ${VER}" --notes "$NOTES" --latest
          # Stable download link that always points at the newest build.
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease --title "OpenWild (latest build)" --notes "$NOTES"
          gh release upload app-latest OpenWild.apk --clobber
          # Keep the 5 newest versioned releases.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v0\.' | sort -V -r | tail -n +6 | while read t; do gh release delete "$t" --yes --cleanup-tag; done

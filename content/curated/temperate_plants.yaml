      onset: "Usually within a few hours.",
      severity: "Bittersweet nightshade. Bright red berries attract children.",
      what_to_do: "Seek medical care, especially for children."}
  survival: {priority: avoid}
  sources: ["Wikipedia: Solanum dulcamara"]


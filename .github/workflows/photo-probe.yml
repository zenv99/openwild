name: Photo probe (exact plants, any licence)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pyyaml pillow
      - working-directory: pipeline
        env:
          OW_INAT_INTERVAL: "1.2"
        run: |
          python -m openwild_pipeline.specimen_probe "Strychnos villosa" "Cycas montana" "Pimpinella javana" "Psammogeton involucratus" "Strophanthus puberulus"

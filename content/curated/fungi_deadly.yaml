- scientific_name: Galerina marginata
  edibility: deadly
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Same amatoxins as the death cap: vomiting and diarrhoea, false recovery, then liver failure."
      onset: "Usually 6–24 hours after eating."
      severity: "Potentially fatal. A small brown mushroom on wood that is easily mistaken for edible or psychoactive species."
      what_to_do: "Seek emergency medical care immediately and report possible amatoxin poisoning."
  survival: {priority: avoid}
  lookalikes:
    - {name: Kuehneromyces mutabilis, danger: edible}
    - {name: Armillaria mellea, danger: edible}
    - {name: Psilocybe spp., danger: psychoactive}
  sources: ["Wikipedia: Galerina marginata"]
  review: {status: unreviewed}

- scientific_name: Lepiota brunneoincarnata

name: Android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        env:
          OW_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Security gate (permissions, HTTPS only, not debuggable, no backup)
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          APK=app/build/outputs/apk/release/app-release.apk
          $AAPT dump badging $APK > badging.txt
          $AAPT dump xmltree $APK AndroidManifest.xml > manifest.txt
          echo "Permissions:"; grep "uses-permission" badging.txt || true
          # Only these permissions are allowed. INTERNET is for region downloads from GitHub only (PackManager.ALLOWED_HOSTS).
          ALLOWED="android.permission.CAMERA android.permission.ACCESS_COARSE_LOCATION android.permission.ACCESS_NETWORK_STATE android.permission.INTERNET org.openwild.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for p in $(grep "uses-permission" badging.txt | sed "s/.*name='\([^']*\)'.*/\1/"); do
            echo " $ALLOWED " | grep -q " $p " || { echo "FAIL: unexpected permission $p"; exit 1; }
          done
          if grep -q "application-debuggable" badging.txt; then echo "FAIL: debuggable build"; exit 1; fi
          grep "allowBackup" manifest.txt || true
          if grep "allowBackup" manifest.txt | grep -q "0xffffffff"; then echo "FAIL: backup enabled"; exit 1; fi
          if grep "usesCleartextTraffic" manifest.txt | grep -q "0xffffffff"; then echo "FAIL: plain http allowed"; exit 1; fi
          grep -q "networkSecurityConfig" manifest.txt || { echo "FAIL: no network security config"; exit 1; }
          # Network code may only live in PackManager (region downloads).
          HITS=$(grep -rlE "HttpURLConnection|java\.net\.URL\b|okhttp|Socket\(" app/src/main/java | grep -v "pack/PackManager.kt" || true)
          if [ -n "$HITS" ]; then echo "FAIL: network code outside PackManager: $HITS"; exit 1; fi
          echo "PASS: only allowed permissions, HTTPS-only, network code only in PackManager, not debuggable, backup off"
      - uses: actions/upload-artifact@v4
        with:
          name: openwild-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish installable APK (versioned release + "app-latest")
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VER="0.6.${OW_BUILD_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk OpenWild.apk
          NOTES="OpenWild ${VER}. Goes online only to check and download region packs from GitHub, and only downloads after you agree. HTTPS only, not debuggable, no cloud backup (checked automatically on every build).
          Install: download OpenWild.apk on your Android phone, open it, allow installing from this source.
          Automatic updates: install Obtainium (free, open source) and add https://github.com/zenv99/openwild"
          # Versioned release: what updaters such as Obtainium follow.
          gh release create "v${VER}" OpenWild.apk --title "OpenWild ${VER}" --notes "$NOTES" --latest
          # Stable download link that always points at the newest build.
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease --title "OpenWild (latest build)" --notes "$NOTES"
          gh release upload app-latest OpenWild.apk --clobber
          # Keep the 5 newest versioned releases.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v0\.' | sort -V -r | tail -n +6 | while read t; do gh release delete "$t" --yes --cleanup-tag; done

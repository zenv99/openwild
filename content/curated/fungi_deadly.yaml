- scientific_name: Cortinarius rubellus
  edibility: deadly
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Intense thirst, frequent urination, nausea, headache, then kidney failure."
      onset: "Very delayed: usually 2–4 days, sometimes up to 3 weeks after eating, so people often don't connect it to the meal."
      severity: "Can cause permanent kidney failure or death."
      what_to_do: "Seek medical care as soon as you suspect it, even days later. Tell doctors you may have eaten a webcap (orellanine)."
  survival: {priority: avoid}
  lookalikes:
    - {name: Cantharellus cibarius, danger: edible}
  sources: ["Wikipedia: Cortinarius rubellus"]
  review: {status: unreviewed}

- scientific_name: Chlorophyllum molybdites
  edibility: toxic
  toxicity: serious
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Severe vomiting, diarrhoea and cramps; can cause dangerous dehydration."
      onset: "Usually 1–3 hours after eating."
      severity: "Rarely fatal but can be very severe, especially in children. Very common on lawns in warm regions."
      what_to_do: "Seek medical care, especially for children or if you cannot keep fluids down. Drink small sips of clean water."
  survival: {priority: avoid}
  lookalikes:
    - {name: Macrolepiota procera, danger: edible}
    - {name: Chlorophyllum rhacodes, danger: edible}
  sources: ["Wikipedia: Chlorophyllum molybdites"]
  review: {status: unreviewed}

- scientific_name: Gyromitra esculenta
  edibility: toxic
  toxicity: deadly
  psychoactive: false
  if_eaten:
    harms:
      toxic_parts: [whole mushroom]
      cooking_makes_safe: false
      symptoms: "Vomiting, diarrhoea, headache, dizziness; in severe cases seizures and liver damage."
      onset: "Usually 6–12 hours after eating."
      severity: "Can be fatal. Fumes from cooking it are also dangerous."
      what_to_do: "Seek emergency medical care. Tell doctors you may have eaten a false morel (gyromitrin)."
  survival: {priority: avoid}
  lookalikes:
    - {name: Morchella esculenta, danger: edible}
  sources: ["Wikipedia: Gyromitra esculenta"]
  review: {status: unreviewed}

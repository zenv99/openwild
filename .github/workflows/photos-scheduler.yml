name: Photos scheduler (every region, Bali-level, one at a time, spread out)

# Works through every published region, nearest to Bali first: a full photo pass, then iNaturalist
# top-ups, repeating any pass that stopped at its time budget. At most MAX_ACTIVE regions run at once,
# which keeps GitHub's 20 parallel jobs and the photo sites' rate limits in check. Progress is kept in
# the "packs" release (photo-progress.json); regions finish when no pass hits its budget any more.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours: one region at a time, so the work is spread out
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: photos-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: content/evidence/wiki_parts
      - name: Dispatch the next regions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release download packs -R "$REPO" -p index.json -p photo-progress.json -D /tmp/s --clobber || true
          gh run list -R "$REPO" --workflow bali-photos.yml --limit 200 --json displayTitle,status,conclusion > /tmp/s/runs.json
          python3 - <<'PY'
          import json, os, subprocess, time
          MAX_ACTIVE, CAP, PHOTOS, MAX_TOPUPS = 1, "5000", "12", 4   # 12 photos/plant, as Bali
          # Nearest to Bali first, then the rest smallest first (quick wins).
          FIRST = ["ID", "TL", "MY", "SG", "BN", "PH", "TH", "VN", "KH", "LA", "MM", "PG", "AU", "FJ", "NZ",
                   "LK", "IN", "NP", "BD", "TW", "JP", "KR", "CN", "US-HI"]
          # Finer packs wait until their country pack has photos, so a phone is not asked to download
          # the same species twice before the country pack exists. Bali is maintained on its own.
          CHILDREN = {"ID-BA": "ID", "US-CA": "US", "US-HI": "US", "US-AK": "US"}
          SKIP = {"WORLD"}
          REFRESH_DAYS = 30
          idx = json.load(open("/tmp/s/index.json"))["packs"]
          try:
              prog = json.load(open("/tmp/s/photo-progress.json"))
          except Exception:
              prog = {}
          size = {p["region_id"]: p["species_count"] for p in idx}
          photo = {p["region_id"]: p.get("photo_species") or 0 for p in idx}
          order = [r for r in FIRST if r in size] + sorted((r for r in size if r not in FIRST and r not in SKIP), key=size.get)
          runs = json.load(open("/tmp/s/runs.json"))
          # Don't start a region while a BioCLIP 2 file is still being built (keeps load low).
          b = subprocess.run(["gh", "run", "list", "-R", os.environ["REPO"], "--workflow", "bioclip.yml", "--limit", "5",
                              "--json", "status"], capture_output=True, text=True).stdout
          if any(x["status"] in ("queued", "in_progress", "waiting", "pending") for x in json.loads(b or "[]")):
              print("BioCLIP 2 build running; waiting"); raise SystemExit(0)
          active = {r["displayTitle"].split()[1] for r in runs
                    if r["status"] in ("queued", "in_progress", "waiting", "pending", "requested") and r["displayTitle"].startswith("Photos ")}
          print("active:", sorted(active))
          # A region whose last two runs failed is left alone until someone looks (avoids a retry loop).
          recent = {}
          for x in runs:  # newest first
              if x["displayTitle"].startswith("Photos ") and x["status"] == "completed":
                  recent.setdefault(x["displayTitle"].split()[1], []).append(x["conclusion"])
          broken = {r for r, c in recent.items() if c[:2] == ["failure", "failure"]}
          if broken:
              print("::warning::needs a look (failed twice):", sorted(broken))
          slots = MAX_ACTIVE - len(active)
          for r in order:
              if slots <= 0:
                  break
              if r in active or r in broken:
                  continue
              parent = CHILDREN.get(r)
              if parent and parent in size and photo.get(parent, 0) == 0 and parent not in broken and parent not in active:
                  continue
              e = prog.get(r)
              fresh = False
              if r == "ID-BA":
                  continue  # Bali is maintained by its own runs
              if e is None:
                  topup = False
              elif e["mode"] == "full" and e.get("budget_hit"):
                  topup = False
              elif e["mode"] == "full" and e.get("more"):
                  topup = False  # this batch finished; more species are still untried
              elif e["mode"] == "full":
                  topup = True
              elif e.get("budget_hit") and e.get("topups", 0) < MAX_TOPUPS:
                  topup = True
              elif e.get("level", 1) < 2:
                  topup = True  # finished before the Bali treatment existed: one more pass with it
              else:
                  age = (time.time() - time.mktime(time.strptime(e["updated"], "%Y-%m-%dT%H:%MZ"))) / 86400
                  if age < REFRESH_DAYS:
                      continue  # done for now
                  topup, fresh = True, True  # monthly refresh: new university, community and open photos
              # Part-by-part facts from Wikipedia first (once per region), as Bali had.
              if not os.path.exists(f"content/evidence/wiki_parts/{r}.csv"):
                  subprocess.run(["gh", "workflow", "run", "parts-data.yml", "-R", os.environ["REPO"], "--ref", "main",
                                  "-f", f"region={r}", "-f", "update_pack=false"], check=False)
              print("dispatch", r, "refresh" if fresh else ("top-up" if topup else "full"))
              subprocess.run(["gh", "workflow", "run", "bali-photos.yml", "-R", os.environ["REPO"], "--ref", "main",
                              "-f", f"region={r}", "-f", "max_species=", "-f", "publish=true",
                              "-f", f"topup={'true' if topup else 'false'}", "-f", f"photo_cap={CAP}",
                              "-f", f"photos={'12' if r == 'ID-BA' else PHOTOS}", "-f", "chain=false",
                              "-f", f"fresh={'true' if fresh else 'false'}"] + ([] if r != "ID-BA" else []), check=True)
              slots -= 1
          done = [r for r in order if r in prog and prog[r]["mode"] == "topup" and not prog[r].get("budget_hit")]
          print(f"SCHEDULE {len(done)}/{len(order)} regions finished")
          PY

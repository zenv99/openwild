# SEED CONTENT — NOT YET EXPERT REVIEWED. Temperate Europe, Asia and North America.

# ---------- dangerous ----------
- scientific_name: Convallaria majalis
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts, especially berries and leaves], cooking_makes_safe: false,
      symptoms: "Nausea, vomiting, abdominal pain, blurred vision, slow or irregular heartbeat.",
      onset: "Usually within a few hours.",
      severity: "Lily of the valley. Contains heart toxins; leaves are mistaken for wild garlic.",
      what_to_do: "Seek emergency medical care. Heart monitoring may be needed."}
  survival: {priority: avoid}
  lookalikes: [{name: Allium ursinum, danger: edible}]
  sources: ["Wikipedia: Convallaria majalis"]

- scientific_name: Colchicum autumnale
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts, especially bulbs and seeds], cooking_makes_safe: false,
      symptoms: "Burning mouth, severe vomiting and diarrhoea, then multi-organ failure.",
      onset: "Usually 2–12 hours; organ failure can follow over the next days.",
      severity: "Autumn crocus. Contains colchicine. Leaves are mistaken for wild garlic. Frequently fatal.",
      what_to_do: "Seek emergency medical care immediately."}
  survival: {priority: avoid}
  lookalikes: [{name: Allium ursinum, danger: edible}]
  sources: ["Wikipedia: Colchicum autumnale"]

- scientific_name: Digitalis purpurea
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts], cooking_makes_safe: false,
      symptoms: "Nausea, vomiting, yellow-green vision, slow or irregular heartbeat.",
      onset: "Usually within a few hours.",
      severity: "Foxglove. Young leaves resemble comfrey and borage.",
      what_to_do: "Seek emergency medical care. Heart monitoring is needed."}
  survival: {priority: avoid}
  lookalikes: [{name: Symphytum officinale, danger: toxic}, {name: Borago officinalis, danger: edible}]
  sources: ["Wikipedia: Digitalis purpurea"]

- scientific_name: Oenanthe crocata
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts, especially roots], cooking_makes_safe: false,
      symptoms: "Nausea, salivation, then seizures and breathing failure.",
      onset: "Fast: often within an hour or two.",
      severity: "Hemlock water dropwort. Roots resemble parsnips. One of the most toxic plants in Europe.",
      what_to_do: "Seek emergency medical care immediately."}
  survival: {priority: avoid}
  lookalikes: [{name: Pastinaca sativa, danger: edible}, {name: Apium graveolens, danger: edible}]
  sources: ["Wikipedia: Oenanthe crocata"]

- scientific_name: Veratrum album
  edibility: deadly
  toxicity: deadly
  if_eaten:
    harms: {toxic_parts: [all parts, especially roots], cooking_makes_safe: false,
      symptoms: "Burning mouth, nausea, vomiting, slow heartbeat, low blood pressure, collapse.",
      onset: "Usually within 30 minutes to a few hours.",
      severity: "White hellebore. Mistaken for yellow gentian and wild garlic. Potentially fatal.",
      what_to_do: "Seek emergency medical care immediately."}
  survival: {priority: avoid}
  lookalikes: [{name: Gentiana lutea, danger: harmless}, {name: Allium ursinum, danger: edible}]
  sources: ["Wikipedia: Veratrum album"]

- scientific_name: Hyoscyamus niger
  edibility: deadly
  toxicity: deadly
  psychoactive: true
  if_eaten:
    harms: {toxic_parts: [all parts, especially seeds and roots], cooking_makes_safe: false,
      symptoms: "Dry mouth, dilated pupils, fast heartbeat, flushing, confusion, delirium, seizures.",
      onset: "Usually within 30 minutes to a few hours.",
      severity: "Henbane. Potentially fatal; potency is unpredictable.",
      what_to_do: "Seek emergency medical care immediately."}
    feeling:
      effects: "Delirium and hallucinations that feel real, with confusion and agitation."
      risks: "Dangerous and frequently frightening; injuries and deaths occur."
  survival: {priority: avoid}
  sources: ["Wikipedia: Hyoscyamus niger"]

- scientific_name: Heracleum mantegazzianum
  edibility: toxic
  toxicity: serious
  if_eaten:
    harms: {toxic_parts: [sap, all parts], cooking_makes_safe: false,
      symptoms: "Sap on skin plus sunlight causes severe burns and blisters that can scar for years; sap in eyes can cause blindness.",
      onset: "Burns appear within 1–2 days of sun exposure.",
      severity: "Giant hogweed. Do not touch; do not cut without full protection.",
      what_to_do: "Wash skin with soap and water immediately, keep it out of the sun for 48 hours, seek medical care for blisters or eye contact."}
  survival: {priority: avoid}
  lookalikes: [{name: Heracleum sphondylium, danger: toxic}, {name: Angelica sylvestris, danger: harmless}]
  sources: ["Wikipedia: Heracleum mantegazzianum"]

- scientific_name: Solanum dulcamara
  edibility: toxic
